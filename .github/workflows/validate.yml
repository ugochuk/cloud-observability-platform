name: Validate observability platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Normalize Terraform formatting
        run: terraform fmt -recursive

      - name: Initialize Azure Terraform
        run: terraform -chdir=terraform/azure init -backend=false

      - name: Validate Azure Terraform
        run: terraform -chdir=terraform/azure validate

      - name: Initialize AWS Terraform
        run: terraform -chdir=terraform/aws init -backend=false

      - name: Validate AWS Terraform
        run: terraform -chdir=terraform/aws validate

      - name: Validate YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: kubernetes slos .github/workflows

      - name: Validate dashboard JSON
        run: jq empty dashboards/checkout-api-overview.json
name: Validate observability platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Normalize Terraform formatting
        run: terraform fmt -recursive

      - name: Initialize Azure Terraform
        run: terraform -chdir=terraform/azure init -backend=false

      - name: Validate Azure Terraform
        run: terraform -chdir=terraform/azure validate

      - name: Initialize AWS Terraform
        run: terraform -chdir=terraform/aws init -backend=false

      - name: Validate AWS Terraform
        run: terraform -chdir=terraform/aws validate

      - name: Validate YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: kubernetes slos .github/workflows
          config_data: |
            extends: default
            rules:
              document-start: disable
              line-length: disable
              truthy: disable

      - name: Validate dashboard JSON
        run: jq empty dashboards/checkout-api-overview.json
